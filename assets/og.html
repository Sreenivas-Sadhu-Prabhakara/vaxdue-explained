<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:#0F231C; --card:#1B3B2E; --line:#2C4A3B;
    --ink:#EFE9DC; --muted:#A9C2B3;
    --rail:#C9D6C2; --rail-dim:#46604f; --dash:#C7CBBE;
    --accent:#6FA98C; --done:#7FC99A; --due:#E8B94E; --over:#E8845C;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background:
      radial-gradient(1000px 520px at 88% -14%, rgba(111,169,140,0.14), transparent 60%),
      linear-gradient(180deg, #0c1d17 0%, #0F231C 100%);
    font-family: var(--sans); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .frame { position: absolute; inset: 0; padding: 68px 84px; display: flex; flex-direction: column; justify-content: space-between; }

  .brand { display: flex; align-items: center; gap: 20px; }
  .mark { width: 66px; height: 66px; }
  .wordmark { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; }
  .wordmark small { font-weight: 600; color: var(--muted); font-size: 30px; letter-spacing: -0.01em; }

  .mid { display: flex; align-items: center; gap: 44px; margin-top: -6px; }

  .headline { max-width: 560px; }
  .headline h1 { font-size: 50px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
  .headline .hl { color: var(--done); }
  .headline p { margin-top: 20px; font-size: 25px; font-weight: 500; color: var(--muted); line-height: 1.35; max-width: 24ch; }

  /* the transform: vague age  ->  dated dose */
  .transform { display: flex; align-items: center; gap: 22px; }
  .age {
    display: flex; flex-direction: column; gap: 12px;
  }
  .age .a {
    background: rgba(10,26,20,0.5); border: 1px dashed var(--line);
    border-radius: 12px; padding: 12px 16px; font-size: 22px; font-weight: 700; color: var(--muted);
    text-align: center;
  }
  .arrow { font-size: 46px; color: var(--accent); font-weight: 800; }

  .dated {
    display: flex; flex-direction: column; gap: 12px;
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px; min-width: 250px;
  }
  .dash { width: 26px; height: 6px; border-radius: 3px; background: var(--dash); flex: none; }
  .dash--done { background: var(--done); }
  .date { font-size: 22px; font-weight: 800; }
  .chip { margin-left: auto; font-size: 17px; font-weight: 800; padding: 4px 12px; border-radius: 999px; border: 1px solid; }
  .chip--done { color: var(--done); border-color: rgba(127,201,154,0.5); }
  .chip--due  { color: var(--due);  border-color: rgba(232,185,78,0.5); }

  .chips { display: flex; gap: 12px; }
  .fchip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(10,26,20,0.5);
    font-size: 20px; font-weight: 700; color: var(--muted); }
  .fchip .g { font-weight: 900; color: var(--accent); }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#1B3B2E"/>
        <rect x="14.6" y="4" width="2.8" height="24" rx="1.4" fill="#C9D6C2"/>
        <rect x="9" y="9" width="6.5" height="2.2" rx="1.1" fill="#C7CBBE"/>
        <rect x="16.5" y="14.5" width="6.5" height="2.2" rx="1.1" fill="#C7CBBE"/>
        <rect x="9" y="20" width="6.5" height="2.2" rx="1.1" fill="#C7CBBE"/>
        <rect x="16.5" y="24.2" width="7.4" height="3" rx="1.5" fill="#7FC99A"/>
      </svg>
      <span class="wordmark">vaxdue <small>explained</small></span>
    </div>

    <div class="mid">
      <div class="headline">
        <h1>From a vague age to <span class="hl">a real date.</span></h1>
        <p>How vaxdue dates every dose from your baby's date of birth.</p>
      </div>

      <div class="transform" aria-hidden="true">
        <div class="age">
          <div class="a">at birth</div>
          <div class="a">6 weeks</div>
          <div class="a">10 weeks</div>
        </div>
        <div class="arrow">&rarr;</div>
        <div class="dated">
          <div class="row"><span class="dash dash--done"></span><span class="date">15 Jan</span><span class="chip chip--done">&#10003; done</span></div>
          <div class="row"><span class="dash dash--done"></span><span class="date">26 Feb</span><span class="chip chip--done">&#10003; done</span></div>
          <div class="row"><span class="dash"></span><span class="date">26 Mar</span><span class="chip chip--due">&#9679; due</span></div>
        </div>
      </div>
    </div>

    <div class="chips">
      <span class="fchip"><span class="g">&#10003;</span>IAP &amp; NIS</span>
      <span class="fchip"><span class="g">&#9633;</span>printable</span>
      <span class="fchip"><span class="g">&#128274;</span>never leaves your device</span>
    </div>
  </div>
</body>
</html>
